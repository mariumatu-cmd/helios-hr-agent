[project]
name = "hr-agentic-rag"
version = "0.1.0"
description = "Agentic HR policy assistant: RAG over a synthetic policy corpus + MCP tool use"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.1.1",
    "fastapi==0.136.3",
    "uvicorn[standard]==0.34.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "pydantic==2.13.5",
    "pydantic-settings==2.7.1",
    "python-dotenv==1.2.2",
    "openai==3.19.2",
    "fastembed==0.8.0",
    "numpy==2.5.1",
    "markdown-it-py==4.2.0",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.1",
    "pypdf==6.15.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.9",
    "fpdf2==2.8.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "agent", "rag", "rag.ingest", "mcp_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
